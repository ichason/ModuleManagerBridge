name: Android Build

on:
  push:
    branches: [ main, master, art ]
  pull_request:
    branches: [ main, master, art ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK manually
      run: |
        # 创建SDK目录
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        
        # 下载兼容Java 8的SDK工具 (版本6.0)
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
        unzip -q commandlinetools-linux-6858069_latest.zip
        
        # 创建正确的文件夹结构
        mkdir -p cmdline-tools/tools
        mv cmdline-tools/* cmdline-tools/tools/ 2>/dev/null || true
        
        # 设置环境变量
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/tools/bin" >> $GITHUB_PATH
        
        # 给sdkmanager添加执行权限
        chmod +x $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager
        
        # 检查文件是否存在
        ls -la $HOME/android-sdk/cmdline-tools/tools/bin/
        
        # 接受许可证
        yes | $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager --licenses || true
        
        # 安装所需的SDK组件
        $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager "platforms;android-23"
        $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager "build-tools;23.0.3"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload API JAR to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-jar
        path: app/build/api/api.jar
      if: always()

    - name: Upload API Sources JAR to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-sources-jar
        path: app/build/api/api-sources.jar
      if: always() 