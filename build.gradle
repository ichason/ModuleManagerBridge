buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter() // 保留作为后备
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.3.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter() // 保留作为后备
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
